                if (g === gender) {
                    if (g === 'all') btn.className = "flex-1 py-2 text-xs md:text-sm rounded-full transition-all duration-200 bg-white text-amber-900 font-bold shadow";
                    else if (g === 'boy') btn.className = "flex-1 py-2 text-xs md:text-sm rounded-full transition-all duration-200 bg-sky-500 text-white font-bold shadow flex items-center justify-center";
                    else if (g === 'girl') btn.className = "flex-1 py-2 text-xs md:text-sm rounded-full transition-all duration-200 bg-rose-400 text-white font-bold shadow flex items-center justify-center";
                } else {
                    let baseClass = "flex-1 py-2 text-xs md:text-sm rounded-full transition-all duration-200 text-stone-500 hover:text-stone-700";
                    if (g === 'boy') baseClass += " hover:text-sky-600 flex items-center justify-center";
                    if (g === 'girl') baseClass += " hover:text-rose-400 flex items-center justify-center";
                    btn.className = baseClass;
                }
            });
            renderTimeline();
        }

        // --- 年齢タブの描画 ---
        function renderAgeTabs() {
            const container = document.getElementById('age-tabs-container');
            let html = '';
            ageGroups.forEach(age => {
                const isSelected = selectedAge === age.id;
                const activeClass = "bg-amber-700 text-white font-bold scale-105 px-4 py-2.5 text-xs md:text-sm rounded-xl whitespace-nowrap transition-all duration-150 shadow-sm";
                const inactiveClass = "bg-amber-50/50 text-amber-800 border border-amber-200/60 hover:bg-amber-100/50 px-4 py-2.5 text-xs md:text-sm rounded-xl whitespace-nowrap transition-all duration-150 shadow-sm";
                html += `<button onclick="setAgeGroup('${age.id}')" class="${isSelected ? activeClass : inactiveClass}">${age.name}</button>`;
            });
            container.innerHTML = html;
        }

        function setAgeGroup(ageId) {
            selectedAge = ageId;
            selectedSubCategory = 'all';
            renderAgeTabs();
            renderSubCategories();
            renderTimeline();
        }

        // --- サブテーマカテゴリーの描画 ---
        function renderSubCategories() {
            const container = document.getElementById('subcategories-container');
            const list = subCategoriesByAge[selectedAge] || subCategoriesByAge['all'];
            const label = document.getElementById('theme-section-label');
            const warningText = document.getElementById('theme-warning-text');
            
            if (selectedAge === 'all') {
                label.innerText = '共通・総合テーマ:';
                warningText.style.display = 'inline';
            } else {
                const foundAge = ageGroups.find(a => a.id === selectedAge);
                label.innerText = `✨ ${foundAge ? foundAge.name.split(' ')[0] : ''}の専門テーマ:`;
                warningText.style.display = 'none';
            }

            let html = '';
            list.forEach(cat => {
                const isSelected = selectedSubCategory === cat.id;
                const activeClass = "bg-stone-800 text-white font-bold shadow-md px-3.5 py-1.5 text-xs rounded-xl transition-all duration-150 flex items-center gap-1 whitespace-nowrap";
                const inactiveClass = "bg-white text-stone-600 border border-stone-200/70 hover:bg-stone-50 px-3.5 py-1.5 text-xs rounded-xl transition-all duration-150 flex items-center gap-1 whitespace-nowrap";
                html += `<button onclick="setSubCategory('${cat.id}')" class="${isSelected ? activeClass : inactiveClass}">${cat.name}</button>`;
            });
            container.innerHTML = html;
        }

        function setSubCategory(catId) {
            selectedSubCategory = catId;
            renderSubCategories();
            renderTimeline();
        }

        // --- タイムライン（投稿リスト）の描画 ---
        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            const isAllSelected = selectedGender === 'all' && selectedAge === 'all' && selectedSubCategory === 'all';
            
            let filteredPosts = posts.filter(post => {
                if (post.isExample) return isAllSelected;
                const matchGender = selectedGender === 'all' || post.gender === selectedGender;
                const matchAge = selectedAge === 'all' || post.category === selectedAge;
                const matchSubCategory = selectedSubCategory === 'all' || (post.sub_categories && post.sub_categories.includes(selectedSubCategory));
                return matchGender && matchAge && matchSubCategory;
            });

            filteredPosts.sort((a, b) => {
                if (a.isExample && !b.isExample) return -1;
                if (!a.isExample && b.isExample) return 1;
                return b.id - a.id;
            });

            if (filteredPosts.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-white rounded-2xl border border-dashed border-stone-300 px-6">
                        <svg class="w-16 h-16 mx-auto mb-4" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                            <line x1="16" y1="56" x2="48" y2="56" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />
                            <path d="M 32,56 C 32,40 44,28 32,18 C 26,13 18,17 18,24" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round" fill="none" />
                            <path d="M 34,42 C 40,41 43,45 39,48 C 36,50 33,45 34,42" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" stroke-linejoin="round" />
                            <g>
                                <path d="M 18,24 C 12,24 10,32 13,36 C 16,40 18,30 18,24 Z" fill="#fda4af" opacity="0.6" />
                                <path d="M 18,24 C 18,30 14,40 19,40 C 23,38 20,30 18,24 Z" fill="#fda4af" opacity="0.6" />
                                <path d="M 18,24 C 24,24 26,32 23,35 C 20,38 18,30 18,24 Z" fill="#fda4af" opacity="0.6" />
                                <path d="M 18,24 C 15,18 21,14 22,20 C 23,23 20,24 18,24 Z" fill="#fda4af" opacity="0.6" />
                                <circle cx="18" cy="24" r="3.5" fill="#fef08a" opacity="0.8" />
                            </g>
                            <path d="M 40,55 C 44,52 48,53 46,56 C 44,58 39,57 40,55 Z" fill="#fda4af" opacity="0.8" />
                        </svg>
                        <p class="text-stone-500 text-sm font-medium">該当する先輩たちの経験談がまだありません。</p>
                        <p class="text-stone-400 text-xs mt-1.5">新しく最初のあたたかい経験談を投稿してみませんか？</p>
                    </div>
                `;
                return;
            }

            let html = '';
            filteredPosts.forEach(post => {
                const safeTitle = escapeHTML(post.title);
                const safeAuthor = escapeHTML(post.author_name);
                const safeStatus = escapeHTML(post.child_status);
                const safeContent = escapeHTML(post.content);

                const borderClass = post.gender === 'boy' ? 'bg-gradient-to-r from-sky-400 to-blue-500' : (post.gender === 'girl' ? 'bg-gradient-to-r from-rose-300 to-pink-400' : 'bg-gradient-to-r from-amber-400 to-amber-500');
                const isMyPost = myPostIds.includes(post.id);
                const deleteBtnHtml = isMyPost ? `<button onclick="openDeleteModal(${post.id})" class="absolute top-3 right-3 text-stone-300 hover:text-red-500 p-2"><i class="fa-regular fa-trash-can text-sm"></i></button>` : '';

                let tagsHtml = '';
                post.sub_categories.forEach(subCatId => {
                    const subCatName = escapeHTML(getSubCategoryName(post.category, subCatId, post.custom_tag));
                    tagsHtml += `<span class="bg-emerald-50 text-emerald-800 px-2.5 py-0.5 text-[10px] font-bold rounded-md flex items-center gap-0.5 whitespace-nowrap"><i class="fa-solid fa-hashtag text-[9px] text-emerald-600/70"></i><span>${subCatName}</span></span>`;
                });

                const showToggle = safeContent.length > 180;
                let displayedContent = safeContent;
                let toggleBtnHtml = '';
                
                if (showToggle && !post.expanded) {
                    displayedContent = safeContent.slice(0, 180) + '...';
                    toggleBtnHtml = `<button onclick="toggleExpand(${post.id})" class="text-xs font-bold text-amber-800 mt-2">続きを表示 <i class="fa-solid fa-chevron-down text-[9px]"></i></button>`;
                } else if (showToggle && post.expanded) {
                    toggleBtnHtml = `<button onclick="toggleExpand(${post.id})" class="text-xs font-bold text-amber-800 mt-2">閉じる <i class="fa-solid fa-chevron-up text-[9px]"></i></button>`;
                }

                const thankBtnClass = post.hasThanked ? 'bg-red-50 border-red-200 text-red-500 scale-105' : 'bg-stone-50 border-stone-100 text-stone-400 hover:text-red-400 hover:bg-red-50/30';
                
                html += `
                    <div class="bg-white border border-stone-200/60 rounded-2xl p-5 shadow-sm relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1.5 ${borderClass}"></div>
                        ${deleteBtnHtml}
                        <div class="flex flex-wrap gap-1.5 mb-3.5 items-center pr-8">
                            <span class="${post.gender === 'boy' ? 'bg-sky-50 text-sky-600' : (post.gender === 'girl' ? 'bg-rose-50 text-rose-500' : 'bg-stone-100 text-stone-600')} px-2.5 py-0.5 text-[10px] font-bold rounded-md">${post.gender === 'boy' ? '男子' : (post.gender === 'girl' ? '女子' : '共通・その他')}</span>
                            <span class="bg-amber-50 text-amber-800 px-2.5 py-0.5 text-[10px] font-bold rounded-md">${getAgeGroupName(post.category)}</span>
                            ${tagsHtml}
                        </div>
                        <h3 class="font-bold text-base md:text-lg text-stone-800 mb-2.5 leading-snug">${safeTitle}</h3>
                        <div class="mb-4">
                            <p class="text-stone-600 text-sm md:text-base leading-relaxed whitespace-pre-wrap">${displayedContent}</p>
                            ${toggleBtnHtml}
                        </div>
                        <div class="flex items-center justify-between pt-3.5 border-t border-stone-100 text-xs text-stone-500">
                            <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-2">
                                <span><i class="fa-solid fa-user-check text-amber-600/70 mr-1"></i>投稿: <strong class="text-stone-700">${safeAuthor}</strong></span>
                                <span class="text-stone-300 hidden sm:inline">|</span>
                                <span>現在の状況: <strong class="text-stone-700">${safeStatus || '未記入'}</strong></span>
                            </div>
                            <button onclick="toggleThank(${post.id})" class="flex items-center gap-1.5 py-1.5 px-3 border rounded-full ${thankBtnClass}">
                                <i class="${post.hasThanked ? 'fa-solid fa-heart fa-beat' : 'fa-solid fa-heart'}"></i>
                                <span class="font-bold text-stone-700">${post.thank_count}</span>
                            </button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function getAgeGroupName(catId) {
            const found = ageGroups.find(a => a.id === catId);
            return found ? found.name : catId;
        }

        function getSubCategoryName(ageId, subCatId, customTag) {
            if (subCatId === 'general') return customTag ? `💬 その他 (${customTag})` : '💬 その他';
            const list = subCategoriesByAge[ageId] || subCategoriesByAge['all'];
            const found = list.find(s => s.id === subCatId);
            if (found) return found.name;
            const fallback = subCategoriesByAge['all'].find(s => s.id === subCatId);
            return fallback ? fallback.name : subCatId;
        }

        function toggleExpand(postId) {
            const post = posts.find(p => p.id === postId);
            if (post) { post.expanded = !post.expanded; renderTimeline(); }
        }

        function toggleThank(postId) {
            const post = posts.find(p => p.id === postId);
            if (post) {
                if (post.hasThanked) { post.thank_count--; post.hasThanked = false; }
                else { post.thank_count++; post.hasThanked = true; }
                renderTimeline();
            }
        }

        // --- 新規投稿モーダル処理 ---
        function openPostModal() {
            document.getElementById('new-category-select').value = selectedAge === 'all' ? 'infant' : selectedAge;
            document.getElementById('new-author-name').value = '';
            document.getElementById('new-child-status').value = '';
            document.getElementById('new-title').value = '';
            document.getElementById('new-content').value = '';
            document.getElementById('new-custom-tag-input').value = '';
            updateNewGenderClass(selectedGender === 'all' ? 'mix' : selectedGender);
            syncNewPostSubCategory();
            document.getElementById('post-modal').classList.remove('hidden');
        }

        function closePostModal() {
            document.getElementById('post-modal').classList.add('hidden');
        }

        function updateNewGenderClass(gender) {
            const boyBtn = document.getElementById('label-new-boy');
            const girlBtn = document.getElementById('label-new-girl');
            const mixBtn = document.getElementById('label-new-mix');
            boyBtn.className = "border rounded-xl p-2.5 flex items-center justify-center gap-1 text-xs cursor-pointer transition-all border-stone-200 text-stone-600 hover:bg-stone-50";
            girlBtn.className = "border rounded-xl p-2.5 flex items-center justify-center gap-1 text-xs cursor-pointer transition-all border-stone-200 text-stone-600 hover:bg-stone-50";
            mixBtn.className = "border rounded-xl p-2.5 flex items-center justify-center gap-1 text-xs cursor-pointer transition-all border-stone-400 bg-stone-50 text-stone-700 font-bold shadow-sm";
            
            const radio = document.querySelector(`input[name="new-gender"][value="${gender}"]`);
            if (radio) radio.checked = true;

            if (gender === 'boy') boyBtn.className = "border rounded-xl p-2.5 flex items-center justify-center gap-1 text-xs cursor-pointer transition-all border-sky-500 bg-sky-50 text-sky-700 font-bold shadow-sm";
            else if (gender === 'girl') girlBtn.className = "border rounded-xl p-2.5 flex items-center justify-center gap-1 text-xs cursor-pointer transition-all border-rose-400 bg-rose-50 text-rose-600 font-bold shadow-sm";
            else if (gender === 'mix') mixBtn.className = "border rounded-xl p-2.5 flex items-center justify-center gap-1 text-xs cursor-pointer transition-all border-stone-400 bg-stone-50 text-stone-700 font-bold shadow-sm";
        }

        // --- 動的に年齢別チェックボックス群を組み立てる ---
        function syncNewPostSubCategory() {
            const ageId = document.getElementById('new-category-select').value;
            const subCats = subCategoriesByAge[ageId] || subCategoriesByAge['all'];
            const container = document.getElementById('new-subcategories-list-container');
            let html = '';
            
            subCats.forEach(cat => {
                if (cat.id !== 'all') {
                    html += `
                        <label class="flex items-start gap-2 p-1.5 text-xs cursor-pointer hover:bg-white rounded-lg transition-all border border-transparent hover:border-stone-100">
                            <input type="checkbox" name="new-subcategories" value="${cat.id}" onchange="checkOtherOption()" class="rounded text-amber-800 focus:ring-amber-500 w-4 h-4 border-stone-300 mt-0.5 shrink-0">
                            <span class="text-stone-700 leading-tight">${cat.name}</span>
                        </label>
                    `;
                }
            });
            container.innerHTML = html;
            checkOtherOption();
        }

        // --- 「その他」のアコーディオン制御 ---
        function checkOtherOption() {
            const checkboxes = document.getElementsByName('new-subcategories');
            let otherChecked = false;
            checkboxes.forEach(cb => { if (cb.value === 'general' && cb.checked) otherChecked = true; });

            const customTagContainer = document.getElementById('new-custom-tag-container');
            if (otherChecked) customTagContainer.classList.remove('hidden');
            else { customTagContainer.classList.add('hidden'); document.getElementById('new-custom-tag-input').value = ''; }
        }

        // --- 投稿処理 (Supabase版) ---
        async function submitPost(e) {
            e.preventDefault();
    
            // (入力値の取得部分はそのまま使います...)
            const checkboxes = document.getElementsByName('new-subcategories');
            const selectedSubCats = [];
            checkboxes.forEach(cb => { if (cb.checked) selectedSubCats.push(cb.value); });

            const warning = document.getElementById('checkbox-warning');
            if (selectedSubCats.length === 0) { warning.classList.remove('hidden'); return; } 
            else { warning.classList.add('hidden'); }

            // Supabaseに送るデータを作る
            const postData = {
                gender: document.querySelector('input[name="new-gender"]:checked').value,
                category: document.getElementById('new-category-select').value,
                sub_categories: selectedSubCats,
                custom_tag: selectedSubCats.includes('general') ? document.getElementById('new-custom-tag-input').value.trim() : '',
                author_name: document.getElementById('new-author-name').value.trim() || '匿名先輩ママ・パパ',
                child_status: document.getElementById('new-child-status').value.trim() || '未記入',
                title: document.getElementById('new-title').value.trim(),
                content: document.getElementById('new-content').value.trim(),
                thank_count: 0
            };

            // Supabaseに保存！
            const { data, error } = await supabaseClient
                .from('posts')
                .insert([postData]);

            if (error) {
                console.error('保存エラー:', error);
                alert('投稿に失敗しました。もう一度試してください。');
                return;
            }

            // 成功したら画面を閉じてリロード
            closePostModal();
            alert('投稿が完了しました！');
            location.reload(); // ページを再読み込みして最新データを表示
        }

        // --- 削除モーダル処理 ---
        function openDeleteModal(postId) {
            postToDelete = postId;
            document.getElementById('delete-modal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            postToDelete = null;
            document.getElementById('delete-modal').classList.add('hidden');
        }

        function executeDeletePost() {
            if (postToDelete) {
                posts = posts.filter(p => p.id !== postToDelete);
                myPostIds = myPostIds.filter(id => id !== postToDelete);
                closeDeleteModal();
                renderTimeline();
            }
        }
    </script>
</body>
</html>
